server:
  port: 8080
  address: 0.0.0.0  # Bind to all network interfaces (allows external connections)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5
      minimum-idle: 1
      keepalive-time: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update  # temporarily allow schema updates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyForMedicineDispenserApp2024PleaseChangeThisInProduction}
  expiration: 86400000

# ── Blender / Python digital-twin connection ────────────────────────────────────
dispenser:
  python:
    host: ${PYTHON_SOCKET_HOST:127.0.0.1}
    port: ${PYTHON_SOCKET_PORT:5001}  # Changed from 5000 to avoid conflict with macOS AirPlay
    timeout-ms: 60000  # 60 seconds to allow slow vending-machine animations (5s/tablet × 8 max tablets)
